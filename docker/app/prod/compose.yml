services:
  frontend:
    build:
      context: ../../..
      dockerfile: docker/app/prod/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - caddie_network

  nginx:
    build:
      context: ../../..
      dockerfile: docker/app/prod/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - frontend
    networks:
      - caddie_network

networks:
  caddie_network:
    external: true
