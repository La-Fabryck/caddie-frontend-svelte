pre-commit:
  parallel: true
  jobs:
    - name: format-and-lint
      group:
        piped: true
        jobs:
          - name: oxfmt
            glob: '*.{js,ts,svelte,json,css,md,html,yml,yaml}'
            run: npm run fix:oxfmt -- {staged_files}
            stage_fixed: true
          - name: eslint
            glob: '*.{js,ts,svelte}'
            run: npm run fix:eslint -- {staged_files}
            stage_fixed: true
    - name: typecheck
      run: npm run typecheck
